<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password | Study Mind</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-purple-300 via-sky-300 to-pink-300 min-h-screen flex items-center justify-center">

  <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md animate-fade-in">
    <!-- Logo -->
    <div class="flex justify-center mb-4">
      <img src="{{ url_for('static', filename='logo/logo.png') }}" alt="Study Mind Logo" class="w-24 mb-4" />
    </div>

    <h2 class="text-3xl font-bold text-center text-gray-800 mb-4">Reset Your Password 🔐</h2>
    <p class="text-center text-gray-600 mb-6">
      Enter your email and we’ll send you a reset link.
    </p>

    <form action="/forgetpassword" method="POST">
      <div>
        <label class="block mb-1 text-gray-700 font-medium">Email</label>
        <input type="email" required class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-yellow-400 outline-none" />
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white py-2 rounded-lg font-semibold hover:from-yellow-600 hover:to-pink-600 transition">
        Send Reset Link
      </button>
    </form>

    <p class="text-center text-sm mt-5 text-gray-700">
      Remembered your password?
      <a href="{{ url_for('login') }}" class="text-purple-700 font-semibold hover:underline">Login</a>
    </p>
  </div>

  <style>
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fade-in 0.6s ease-out forwards;
    }
  </style>
</body>
</html>
