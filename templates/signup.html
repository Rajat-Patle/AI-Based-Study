<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Mind - Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Link to the external JS file -->
  <script src="{{ url_for('static', filename='JS/signup_firebase.js') }}" type="module"></script>
</head>

<body class="bg-gradient-to-r from-pink-300 via-purple-300 to-blue-300 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <div class="flex flex-col items-center">
      <img src="{{ url_for('static', filename='logo/logo.png') }}" alt="Study Mind Logo" class="w-24 mb-4" />
      <h2 class="text-2xl font-bold text-gray-800 mb-6">Create Your Account</h2>
    </div>

    <form id="signup-form">
      <div class="mb-4">
        <label for="name" class="block text-gray-700 font-semibold mb-1">Full Name</label>
        <input
          type="text"
          id="name"
          name="name"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="Enter your name"
          required
        />
      </div>

      <div class="mb-4">
        <label for="email" class="block text-gray-700 font-semibold mb-1">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="Enter your email"
          required
        />
      </div>

      <div class="mb-4 relative">
        <label for="password" class="block text-gray-700 font-semibold mb-1">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="Enter your password"
          required
        />
        <button
          type="button"
          onclick="togglePassword()"
          class="absolute right-3 top-9 text-gray-500 hover:text-gray-700"
        >
          <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
            viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M2.458 12C3.732 7.943 7.522 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.478 0-8.268-2.943-9.542-7z" />
          </svg>
        </button>
      </div>

      <button type="submit"
        class="w-full bg-purple-500 hover:bg-purple-600 text-white font-semibold py-2 px-4 rounded-lg transition">
        Sign Up
      </button>
    </form>

    <div class="text-center my-4 text-gray-600">OR</div>

    <button
      onclick="signupWithGoogle()"
      type="button"
      class="w-full flex items-center justify-center gap-3 border border-gray-300 text-gray-700 py-2 rounded-lg hover:bg-gray-100 transition"
    >
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="h-5 w-5" alt="Google Icon" />
      Sign up with Google
    </button>

    <p class="text-sm text-center mt-6 text-gray-600">
      Already have an account?
      <a href="{{ url_for('login') }}" class="text-blue-500 hover:underline font-medium">Log in</a>
    </p>
  </div>
</body>
</html>
