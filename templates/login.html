<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Mind - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SweetAlert2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.0/dist/sweetalert2.min.js"></script>

  <!-- Firebase v9+ Modular SDK -->
  <script type="module">
    // Firebase SDK import
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js';

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBccwKK32upLrgpBLI96Ff5tszWp1xfhB4",
      authDomain: "ai-study-solution.firebaseapp.com",
      projectId: "ai-study-solution",
      storageBucket: "ai-study-solution.appspot.com",
      messagingSenderId: "836349905068",
      appId: "1:836349905068:web:d73d7fe0bfb543ba82b709",
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Login function
    document.getElementById('loginForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      console.log('Attempting to sign in with email:', email);

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          console.log('Login successful!', userCredential);
          // Show SweetAlert success message
          Swal.fire({
            icon: "success",
            title: "Logged in successfully!",
            timer: 1000,
            showConfirmButton: false,
          }).then(function() {
            window.location.href = "/dashboard"; // Redirect to dashboard
          });
        })
        .catch((error) => {
          console.error("Error during login:", error.message);
          alert("Error: " + error.message);
        });
    });

    // Google Sign-In function
    function signInWithGoogle() {
      console.log('Attempting Google Sign-In...');
      const provider = new GoogleAuthProvider();
      signInWithPopup(auth, provider)
        .then((result) => {
          console.log('Google login successful!', result);
          // Show SweetAlert success message
          Swal.fire({
            icon: "success",
            title: "Logged in successfully with Google!",
            timer: 1000,
            showConfirmButton: false,
          }).then(function() {
            window.location.href = "/dashboard"; // Redirect to dashboard
          });
        })
        .catch((error) => {
          console.error('Error during Google Sign-In:', error.message);
          alert("Error: " + error.message);
        });
    }
    
    // Attach Google Sign-In to the button
    window.signInWithGoogle = signInWithGoogle; // Expose to global scope so it works in the button click
  </script>

</head>
<body class="bg-gradient-to-r from-blue-300 via-purple-300 to-pink-300 min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <div class="flex flex-col items-center">
      <img src="{{ url_for('static', filename='logo/logo.png') }}" alt="Study Mind Logo" class="w-24 mb-4" />
      <h2 class="text-2xl font-bold text-gray-800 mb-6">Welcome to Study Mind</h2>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="mb-4 px-4 py-2 rounded text-white {{ 'bg-green-500' if category == 'success' else 'bg-red-500' if category == 'danger' else 'bg-yellow-500' }}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form id="loginForm">
      <div class="mb-4">
        <label for="email" class="block text-gray-700 font-semibold mb-1">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="Enter your email"
          required
        />
      </div>

      <div class="mb-4 relative">
        <label for="password" class="block text-gray-700 font-semibold mb-1">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="Enter your password"
          required
        />
        <button
          type="button"
          onclick="togglePassword()"
          class="absolute right-3 top-9 text-gray-500 hover:text-gray-700"
        >
          <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
            viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M2.458 12C3.732 7.943 7.522 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.478 0-8.268-2.943-9.542-7z" />
          </svg>
        </button>
      </div>

      <div class="flex justify-between items-center mb-4">
        <a href="{{ url_for('forget_password') }}" class="text-sm text-blue-500 hover:underline">Forgot Password?</a>
      </div>

      <button type="submit"
        class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg transition">
        Login
      </button>

      <button
        type="button"
        class="w-full flex items-center justify-center gap-3 border mt-4 border-gray-300 text-gray-700 py-2 rounded-lg hover:bg-gray-100 transition"
        onclick="signInWithGoogle()">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="h-5 w-5" alt="Google Icon" />
        Sign in with Google
      </button>
    </form>

    <p class="text-sm text-center mt-6 text-gray-600">
      Don’t have an account?
      <a href="{{ url_for('signup') }}" class="text-blue-500 hover:underline font-medium">Sign up</a>
    </p>
  </div>

</body>
</html>
